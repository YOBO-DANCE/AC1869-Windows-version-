name: Build and Package 1869AC

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-package:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (VLC)
        run: |
          brew install --cask vlc || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-vlc pyinstaller

      - name: Compile Terminal App with PyInstaller
        run: |
          pyinstaller --onefile --name 1869AC main.py

      - name: Package Executable with Songs Folder
        run: |
          # Copy the songs directory into dist alongside the compiled executable
          cp -r songs dist/
          # Zip the compiled app and songs folder together
          cd dist
          zip -r ../1869AC-app-with-songs.zip 1869AC songs
          cd ..

      - name: Bundle Full Source Code into ZIP
        run: |
          zip -r 1869AC-source.zip . -x "*.git*" -x "*build*" -x "*dist*" -x "*.DS_Store*"

      - name: Upload App Package Artifact (Executable + Songs)
        uses: actions/upload-artifact@v4
        with:
          name: 1869AC-app-with-songs
          path: 1869AC-app-with-songs.zip
          retention-days: 7

      - name: Upload Full Source ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1869AC-source-code
          path: 1869AC-source.zip
          retention-days: 7
