name: Build and Package 1869AC

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-package:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (VLC)
        run: |
          brew install --cask vlc || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-vlc pyinstaller pygame

      - name: Compile Terminal App with PyInstaller
        run: |
          pyinstaller --onefile --name 1869AC main.py

      - name: Package Executable
        run: |
          cd dist
          zip -r ../1869AC-app.zip 1869AC
          cd ..

      - name: Bundle Python Source Files into ZIP
        run: |
          zip 1869AC-source.zip main.py songs_path.py widgets.py

      - name: Upload App Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1869AC-app
          path: 1869AC-app.zip
          retention-days: 7

      - name: Upload Source Code Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1869AC-source-code
          path: 1869AC-source.zip
          retention-days: 7
