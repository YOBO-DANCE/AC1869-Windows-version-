name: Build and Package 1869AC

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-package:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (VLC)
        run: |
          brew install --cask vlc || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-vlc pyinstaller pygame

      - name: Compile Terminal App with PyInstaller
        run: |
          pyinstaller --onefile --hidden-import widgets --hidden-import songs_path --add-data "turning_pages-ui-toggle-off-confirmation-608627.mp3:." --name 1869AC main.py

      - name: Package Executable with UI Sound and Config
        run: |
          cp turning_pages-ui-toggle-off-confirmation-608627.mp3 dist/ 2>/dev/null || true
          cp songs_path.py dist/ 2>/dev/null || true
          cd dist
          zip -r ../1869AC-app.zip 1869AC turning_pages-ui-toggle-off-confirmation-608627.mp3 songs_path.py
          cd ..

      - name: Bundle Python Source Files & UI Audio into ZIP
        run: |
          zip 1869AC-source.zip main.py songs_path.py widgets.py turning_pages-ui-toggle-off-confirmation-608627.mp3

      - name: Upload App Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1869AC-app
          path: 1869AC-app.zip
          retention-days: 7

      - name: Upload Source Code Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1869AC-source-code
          path: 1869AC-source.zip
          retention-days: 7
